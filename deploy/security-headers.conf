# Cabeceras de seguridad de la landing (www.klientia.app) — versionadas en el repo.
# Auditoría Ciber (T1, Alta): la landing es un EXPORT ESTÁTICO de Next → `headers()` de next.config
# NO aplica (no hay servidor Node). Estas cabeceras deben ponerlas el nginx/Traefik que sirve el
# sitio. Este archivo se `include` dentro del `server { ... }` (o `location /`) que sirve la landing.
#
# NO se aplica solo: el CTO lo deja listo; el apply va en el MISMO deploy del lote de Marca, con el
# Go de Diego. Antes de aplicar, Marca debe verificar que la landing sigue cargando (pixels + fuentes).
#
# `always` = enviar la cabecera también en respuestas de error (404, etc.), no solo 2xx.

# ── Anti-clickjacking (el hallazgo Alta): la landing es la puerta de registro; sin esto se puede
#    incrustar en un iframe y superponer los CTAs a app.klientia.app/register.
add_header X-Frame-Options "DENY" always;

# ── No adivinar el tipo MIME (anti-sniffing).
add_header X-Content-Type-Options "nosniff" always;

# ── Fugar lo mínimo del referer al navegar a terceros.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── Forzar HTTPS por 1 año en el dominio y subdominios (app./api. ya son https).
#    (Sin `preload` a propósito: es un compromiso difícil de revertir; se puede añadir luego.)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── Apagar APIs potentes del navegador que la landing no usa.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;

# ── Content-Security-Policy. PRAGMÁTICA a propósito: la landing dispara pixels de Meta/TikTok/GA4
#    (scripts inline + externos) y no queremos romper el tracking de Marca. Lo que SÍ cierra:
#    `frame-ancestors 'none'` (clickjacking, refuerza X-Frame-Options), `object-src 'none'`,
#    `base-uri 'self'`. img/connect quedan abiertos a https: porque los pixels emiten beacons a
#    muchos subdominios; se puede endurecer más adelante enumerando hosts.
#    Fuentes: la LANDING usa `next/font` (auto-hospedadas → 'self'). El portal de DOCS embebido
#    (/doc/es/*, MkDocs) sí carga Google Fonts (verificado por Marca) → se permiten sus hosts
#    conocidos (fonts.googleapis.com para el CSS, fonts.gstatic.com para los archivos de fuente)
#    para que las docs no se vean degradadas. Apertura mínima a dos hosts de Google, nada más.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://www.googletagmanager.com https://analytics.tiktok.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self'; upgrade-insecure-requests" always;
