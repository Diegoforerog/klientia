# ⚠️ OBSOLETO — ESTE NO ES EL DEPLOY DE PRODUCCIÓN.
# Producción de la landing (www.klientia.app) = build LOCAL + subida por rsync/scp
# al VPS (nginx sirviendo estáticos desde /opt/klientia-landing/site). Ver runbook de DevOps.
# Este workflow publicaba a GitHub Pages, un destino MUERTO con basePath /klientia.
# Se le quitó el disparo automático en `push` para que no se ejecute ni confunda;
# queda solo como manual (workflow_dispatch) por si alguna vez se retoma GitHub Pages.
name: Deploy a GitHub Pages (OBSOLETO — no es prod)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (export estático)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # Medición: los valores los pone Diego como secrets del repo (vacío = no renderiza, seguro).
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
